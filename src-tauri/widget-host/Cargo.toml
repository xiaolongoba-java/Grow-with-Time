[package]
name = "grow-with-time-widget-host"
version = "1.5.38"
edition = "2021"
publish = false

[dependencies]
raw-window-handle = "0.6"
serde_json = "1"
tao = "0.35"
wry = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
