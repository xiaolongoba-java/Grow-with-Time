[[permission]]
identifier = "allow-main-app"
description = "Custom commands for the main window (settings, backup, organize, wallpaper, notifications)."
commands.allow = [
  "show_quick_add",
  "show_inspiration",
  "show_float",
  "start_timer_ui",
  "show_notification_popup",
  "open_main_window",
  "today_pending_count",
  "schedule_native_notification",
  "cancel_native_notification",
  "sync_native_notifications",
  "database_health",
  "list_database_backups",
  "schedule_database_restore",
  "open_data_directory",
  "restart_app",
  "scan_desktop",
  "preview_desktop_organize",
  "apply_desktop_organize",
  "undo_desktop_organize",
  "get_wallpaper_library",
  "import_wallpapers",
  "apply_wallpaper",
  "remove_wallpaper",
  "update_wallpaper_settings",
]
