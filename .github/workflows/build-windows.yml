name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Release check, tests, and frontend build
        run: npm run release:check

      - name: Build Tauri (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Smoke test fresh install and existing database
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "grow-with-time-smoke"
          $roaming = Join-Path $testRoot "Roaming"
          $local = Join-Path $testRoot "Local"
          New-Item -ItemType Directory -Force -Path $roaming, $local | Out-Null
          $env:APPDATA = $roaming
          $env:LOCALAPPDATA = $local
          $exe = Resolve-Path "src-tauri/target/release/minimal-todo.exe"
          foreach ($scenario in @("fresh", "existing")) {
            $process = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "$scenario startup failed with exit code $($process.ExitCode)"
            }
            Stop-Process -Id $process.Id -Force
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: grow-with-time-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/nsis/*.exe

      - name: Sync installer to Gitee Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "跳过 Gitee 同步：未配置 secrets.GITEE_TOKEN"
            exit 0
          fi
          EXE="$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n 1)"
          node scripts/sync-gitee-release.mjs --tag "${GITHUB_REF_NAME}" --file "$EXE"
