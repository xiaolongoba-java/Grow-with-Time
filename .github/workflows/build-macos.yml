# Build unsigned macOS Apple Silicon (M1/M2/M3/M4) installer.
# After push, download the "macos-aarch64" artifact from the Actions run.
name: Build macOS (Apple Silicon)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-arm:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (aarch64)
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg

      - name: Upload DMG / App
        uses: actions/upload-artifact@v4
        with:
          name: grow-with-time-macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
